<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overlap, Apple-inspired</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<style>
/* Scale the supplied fixed canvas to the preview iframe width. */
html,body{margin:0;width:720px;overflow:hidden}
@media(max-width:719px){body{zoom:calc(100vw / 720px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;background:#F3EEE6}
a{color:#0B7A45}a:hover{color:#075A33}
@keyframes breathe{0%,100%{transform:scale(0.92);opacity:0.45}50%{transform:scale(1.06);opacity:0.7}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
</style>
</helmet>
<div style="width: 720px; height: 1356px; position: relative; overflow: hidden; background: #F3EEE6">

  <div style="position: absolute; width: 380px; height: 380px; left: -190px; top: 60px; border-radius: 50%; background: #EFB04A; filter: blur(70px); opacity: 0.7"></div>
  <div style="position: absolute; width: 480px; height: 480px; right: -230px; bottom: -120px; border-radius: 50%; background: #AFC4A6; filter: blur(80px); opacity: 0.8"></div>
  <div style="position: absolute; width: 300px; height: 300px; left: -150px; bottom: -150px; border-radius: 50%; background: #F2917A; filter: blur(70px); opacity: 0.7"></div>

  <div style="position: absolute; left: 150px; top: 1148px; width: 420px; height: 60px; border-radius: 50%; background: #1B1F2E; filter: blur(34px); opacity: 0.35"></div>

  <div style="position: absolute; left: 105px; top: 368px; width: 6px; height: 44px; border-radius: 3px 0 0 3px; background: linear-gradient(90deg, #8B8E95, #D6D8DC)"></div>
  <div style="position: absolute; left: 105px; top: 438px; width: 6px; height: 84px; border-radius: 3px 0 0 3px; background: linear-gradient(90deg, #8B8E95, #D6D8DC)"></div>
  <div style="position: absolute; left: 105px; top: 538px; width: 6px; height: 84px; border-radius: 3px 0 0 3px; background: linear-gradient(90deg, #8B8E95, #D6D8DC)"></div>
  <div style="position: absolute; left: 609px; top: 468px; width: 6px; height: 130px; border-radius: 0 3px 3px 0; background: linear-gradient(90deg, #D6D8DC, #8B8E95)"></div>

  <div style="position: absolute; left: 110px; top: 168px; width: 500px; height: 1000px; box-sizing: border-box; padding: 9px; border-radius: 96px; background: linear-gradient(145deg, #E4E5E8 0%, #8E9096 22%, #F2F2F4 48%, #6E7076 74%, #C9CACF 100%); box-shadow: 0 50px 90px -30px rgba(20,24,40,0.55), 0 18px 36px -18px rgba(20,24,40,0.45)">
    <div style="width: 100%; height: 100%; box-sizing: border-box; padding: 9px; border-radius: 87px; background: #000000">
      <div style="position: relative; width: 100%; height: 100%; border-radius: 78px; overflow: hidden; background: radial-gradient(circle at 50% 46%, color-mix(in oklab, {{accent}} 20%, #0E1428) 0%, #0A0F1F 38%, #05070E 100%)">

        <div style="position: absolute; left: 50%; top: 22px; width: 124px; height: 36px; margin-left: -62px; border-radius: 18px; background: #000000; box-shadow: 0 0 0 1px rgba(255,255,255,0.04)"></div>

        <div style="position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; margin-left: -150px; margin-top: -170px; border-radius: 50%; background: {{accent}}; filter: blur(70px); animation: breathe 4s ease-in-out infinite"></div>

        <div style="position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin-left: -110px; margin-top: -130px; border-radius: 50px; overflow: hidden; background: linear-gradient(165deg, color-mix(in oklab, {{accent}} 70%, white) 0%, {{accent}} 45%, color-mix(in oklab, {{accent}} 62%, #04220F) 100%); box-shadow: 0 30px 60px -20px color-mix(in oklab, {{accent}} 60%, black), inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -2px 6px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center">
          <div style="position: absolute; left: 0; top: 0; width: 220px; height: 110px; background: linear-gradient(180deg, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0) 100%)"></div>
          <svg width="156" height="156" viewBox="0 0 100 100" role="img" aria-label="Two overlapping circles" style="position: relative; filter: drop-shadow(0 6px 10px rgba(0,40,18,0.35))">
            <defs>
              <linearGradient id="orbFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFFFFF"></stop>
                <stop offset="1" stop-color="#E7F6EC"></stop>
              </linearGradient>
              <clipPath id="rightOrb"><circle cx="62" cy="50" r="25"></circle></clipPath>
              <clipPath id="leftInner"><circle cx="37" cy="50" r="20"></circle></clipPath>
            </defs>
            <circle cx="62" cy="50" r="25" fill="url(#orbFill)"></circle>
            <circle cx="37" cy="50" r="22" fill="none" stroke="#FFFFFF" stroke-width="6"></circle>
            <g clip-path="url(#rightOrb)">
              <circle cx="37" cy="50" r="22" fill="none" stroke-width="3" style="stroke: color-mix(in oklab, {{accent}} 75%, #03351A)"></circle>
              <g clip-path="url(#leftInner)">
                <g style="animation: drift 3.2s ease-in-out infinite">
                  <rect x="30" y="36" width="40" height="4" rx="2" style="fill: color-mix(in oklab, {{accent}} 75%, #03351A)"></rect>
                  <rect x="30" y="45" width="40" height="4" rx="2" style="fill: color-mix(in oklab, {{accent}} 75%, #03351A)"></rect>
                  <rect x="30" y="54" width="40" height="4" rx="2" style="fill: color-mix(in oklab, {{accent}} 75%, #03351A)"></rect>
                  <rect x="30" y="63" width="40" height="4" rx="2" style="fill: color-mix(in oklab, {{accent}} 75%, #03351A)"></rect>
                </g>
              </g>
            </g>
          </svg>
        </div>

        <div style="position: absolute; left: 50%; top: 50%; width: 220px; height: 70px; margin-left: -110px; margin-top: 104px; border-radius: 50px 50px 0 0; background: linear-gradient(180deg, color-mix(in oklab, {{accent}} 28%, transparent) 0%, rgba(0,0,0,0) 100%); filter: blur(6px); opacity: 0.6"></div>

        <div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: linear-gradient(125deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 30%, rgba(255,255,255,0) 45%)"></div>

        <div style="position: absolute; left: 50%; bottom: 16px; width: 150px; height: 5px; margin-left: -75px; border-radius: 3px; background: rgba(255,255,255,0.6)"></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2FE07F","options":["#2FE07F","#30D158","#0A84FF","#FF6B4A"]},"$preview":{"width":720,"height":1356}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2FE07F' };
  }
}
</script>
</body>
</html>

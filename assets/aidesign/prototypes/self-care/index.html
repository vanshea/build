<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;background:#F3EEE6}
a{color:#0B7A45}a:hover{color:#075A33}
@keyframes breathe{0%,100%{transform:scale(0.92);opacity:0.45}50%{transform:scale(1.06);opacity:0.7}}
@keyframes heartBeat{0%,40%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(0.97)}32%{transform:scale(1.08)}}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:0.45}30%{transform:translateY(-7px);opacity:1}}
</style>
</helmet>
<div style="width: 720px; height: 1356px; position: relative; overflow: hidden; background: #F3EEE6">

  <div style="position: absolute; width: 440px; height: 440px; right: -170px; top: -130px; border-radius: 50%; background: #F2917A; filter: blur(70px); opacity: 0.75"></div>
  <div style="position: absolute; width: 340px; height: 340px; left: -170px; top: 120px; border-radius: 50%; background: #EFB04A; filter: blur(70px); opacity: 0.7"></div>
  <div style="position: absolute; width: 300px; height: 300px; left: -150px; bottom: -150px; border-radius: 50%; background: #F2917A; filter: blur(70px); opacity: 0.6"></div>

  <div style="position: absolute; left: 150px; top: 1148px; width: 420px; height: 60px; border-radius: 50%; background: #1B1F2E; filter: blur(34px); opacity: 0.35"></div>

  <div style="position: absolute; left: 105px; top: 368px; width: 6px; height: 44px; border-radius: 3px 0 0 3px; background: linear-gradient(90deg, #8B8E95, #D6D8DC)"></div>
  <div style="position: absolute; left: 105px; top: 438px; width: 6px; height: 84px; border-radius: 3px 0 0 3px; background: linear-gradient(90deg, #8B8E95, #D6D8DC)"></div>
  <div style="position: absolute; left: 105px; top: 538px; width: 6px; height: 84px; border-radius: 3px 0 0 3px; background: linear-gradient(90deg, #8B8E95, #D6D8DC)"></div>
  <div style="position: absolute; left: 609px; top: 468px; width: 6px; height: 130px; border-radius: 0 3px 3px 0; background: linear-gradient(90deg, #D6D8DC, #8B8E95)"></div>

  <div style="position: absolute; left: 110px; top: 168px; width: 500px; height: 1000px; box-sizing: border-box; padding: 9px; border-radius: 96px; background: linear-gradient(145deg, #E4E5E8 0%, #8E9096 22%, #F2F2F4 48%, #6E7076 74%, #C9CACF 100%); box-shadow: 0 50px 90px -30px rgba(20,24,40,0.55), 0 18px 36px -18px rgba(20,24,40,0.45)">
    <div style="width: 100%; height: 100%; box-sizing: border-box; padding: 9px; border-radius: 87px; background: #000000">
      <div style="position: relative; width: 100%; height: 100%; border-radius: 78px; overflow: hidden; background: radial-gradient(circle at 50% 40%, color-mix(in oklab, {{accent}} 20%, #0E1428) 0%, #0A0F1F 38%, #05070E 100%)">

        <div style="position: absolute; left: 50%; top: 22px; width: 124px; height: 36px; margin-left: -62px; border-radius: 18px; background: #000000; box-shadow: 0 0 0 1px rgba(255,255,255,0.04)"></div>

        <div style="position: absolute; left: 50%; top: 40%; width: 300px; height: 300px; margin-left: -150px; margin-top: -150px; border-radius: 50%; background: {{accent}}; filter: blur(70px); animation: breathe 4s ease-in-out infinite"></div>

        <div style="position: absolute; left: 50%; top: 40%; width: 220px; height: 220px; margin-left: -110px; margin-top: -110px; border-radius: 50px; overflow: hidden; background: linear-gradient(165deg, color-mix(in oklab, {{accent}} 70%, white) 0%, {{accent}} 45%, color-mix(in oklab, {{accent}} 62%, #04220F) 100%); box-shadow: 0 30px 60px -20px color-mix(in oklab, {{accent}} 60%, black), inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -2px 6px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center">

        <div style="position: absolute; left: 50%; top: 40%; width: 220px; height: 70px; margin-left: -110px; margin-top: 114px; border-radius: 50px 50px 0 0; background: linear-gradient(180deg, color-mix(in oklab, {{accent}} 28%, transparent) 0%, rgba(0,0,0,0) 100%); filter: blur(6px); opacity: 0.6"></div>

        <!-- frosted typing capsule -->
        <div style="position: absolute; left: 38px; right: 38px; bottom: 56px; height: 84px; border-radius: 42px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 20px 40px -20px rgba(0,0,0,0.6); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center">

            <div style="width: 11px; height: 11px; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 8px {{accent}}; animation: typing 1.3s ease-in-out 0.18s infinite"></div>
            <div style="width: 11px; height: 11px; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 8px {{accent}}; animation: typing 1.3s ease-in-out 0.36s infinite"></div>
          </div>
        </div>

        <div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: linear-gradient(125deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 30%, rgba(255,255,255,0) 45%)"></div>

      </div>
    </div>
  </div>
</div>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 678" role="img" aria-labelledby="title desc">
  <title id="title">Contact app static preview</title>
  <desc id="desc">A polished phone-style preview showing prioritized people and conversations.</desc>
  <defs>
    <linearGradient id="screen" x1="50" y1="44" x2="308" y2="634" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202034"/>
      <stop offset=".56" stop-color="#11121d"/>
      <stop offset="1" stop-color="#08090f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(268 112) rotate(126) scale(230 190)">
      <stop stop-color="#7b6bc7" stop-opacity=".48"/>
      <stop offset=".54" stop-color="#c77b54" stop-opacity=".14"/>
      <stop offset="1" stop-color="#08090f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mia" x1="84" y1="255" x2="125" y2="299" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e49a72"/><stop offset="1" stop-color="#a85c3f"/>
    </linearGradient>
    <linearGradient id="priya" x1="84" y1="329" x2="125" y2="373" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9585e5"/><stop offset="1" stop-color="#5f50ad"/>
    </linearGradient>
    <filter id="phoneShadow" x="20" y="20" width="320" height="650" filterUnits="userSpaceOnUse">
      <feDropShadow dy="20" stdDeviation="22" flood-color="#19121b" flood-opacity=".36"/>
    </filter>
    <filter id="cardShadow" x="52" y="195" width="256" height="323" filterUnits="userSpaceOnUse">
      <feDropShadow dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="360" height="678" rx="36" fill="#f7f1e6"/>
  <g filter="url(#phoneShadow)">
    <rect x="43" y="36" width="274" height="606" rx="42" fill="#161621"/>
    <rect x="51" y="44" width="258" height="590" rx="36" fill="url(#screen)"/>
    <rect x="51" y="44" width="258" height="590" rx="36" fill="url(#glow)"/>
  </g>
  <rect x="143" y="58" width="74" height="18" rx="9" fill="#08090f"/>
  <text x="75" y="116" fill="#fff" opacity=".58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" letter-spacing=".9">FRIDAY, JULY 10</text>
  <text x="75" y="153" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="31" font-weight="750">Today</text>
  <g>
    <rect x="68" y="178" width="224" height="35" rx="18" fill="#fff" opacity=".12"/>
    <rect x="71" y="181" width="70" height="29" rx="15" fill="#fff" opacity=".94"/>
    <text x="106" y="200" text-anchor="middle" fill="#15151b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="700">Focused</text>
    <text x="180" y="200" text-anchor="middle" fill="#fff" opacity=".58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="600">Groups</text>
    <text x="253" y="200" text-anchor="middle" fill="#fff" opacity=".58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="600">Everyone</text>
  </g>
  <text x="78" y="239" fill="#fff" opacity=".52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="600">3 people waiting on you</text>
  <g filter="url(#cardShadow)">
    <rect x="68" y="251" width="224" height="226" rx="27" fill="#25242d" fill-opacity=".92"/>
    <rect x="69" y="252" width="222" height="224" rx="26" stroke="#fff" stroke-opacity=".06"/>
  </g>
  <circle cx="105" cy="295" r="21" fill="url(#mia)" stroke="#f0b04f" stroke-width="2"/>
  <text x="105" y="300" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="800">MT</text>
  <text x="138" y="290" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750">Mia Tanaka</text>
  <text x="138" y="309" fill="#f0b04f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="650">Sign-off before 3 PM</text>
  <path d="M138 327h134" stroke="#fff" stroke-opacity=".1"/>
  <circle cx="105" cy="367" r="21" fill="url(#priya)"/>
  <text x="105" y="372" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="800">PS</text>
  <text x="138" y="362" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750">Priya Sharma</text>
  <text x="138" y="381" fill="#fff" opacity=".55" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10">Contract redlines</text>
  <path d="M138 399h134" stroke="#fff" stroke-opacity=".1"/>
  <circle cx="105" cy="439" r="21" fill="#5b9470"/>
  <text x="105" y="444" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="800">D</text>
  <text x="138" y="434" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="750">Dad</text>
  <text x="138" y="453" fill="#fff" opacity=".55" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10">Following up on Tuesday</text>
  <g>
    <rect x="82" y="538" width="196" height="58" rx="29" fill="#fff" opacity=".1"/>
    <rect x="83" y="539" width="194" height="56" rx="28" stroke="#fff" stroke-opacity=".14"/>
    <circle cx="114" cy="567" r="17" fill="url(#mia)"/>
    <circle cx="137" cy="567" r="17" fill="url(#priya)" stroke="#292833" stroke-width="3"/>
    <text x="165" y="563" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="750">Mia + 2 waiting</text>
    <text x="165" y="578" fill="#f0b04f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="8.5" font-weight="650">Tap to open Contact</text>
  </g>
  <rect x="153" y="616" width="54" height="4" rx="2" fill="#fff" opacity=".62"/>
</svg>

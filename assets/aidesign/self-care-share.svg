  <circle cx="259" cy="312" r="72" fill="#ff8a4c"/><text x="259" y="335" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="66" font-weight="850">SC</text>

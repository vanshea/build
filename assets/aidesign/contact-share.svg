<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Contact — The Problem</title><desc id="desc">LinkedIn preview card for the Contact prototype.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#fbf6ec"/><stop offset="1" stop-color="#eee4d4"/></linearGradient>
    <linearGradient id="app" x1="94" y1="147" x2="424" y2="477" gradientUnits="userSpaceOnUse"><stop stop-color="#26253f"/><stop offset=".54" stop-color="#161620"/><stop offset="1" stop-color="#0a0b10"/></linearGradient>
    <linearGradient id="mia"><stop stop-color="#e39a72"/><stop offset="1" stop-color="#a75c3f"/></linearGradient><linearGradient id="priya"><stop stop-color="#9585e5"/><stop offset="1" stop-color="#5d4fab"/></linearGradient>
    <filter id="shadow" x="50" y="100" width="430" height="430"><feDropShadow dy="28" stdDeviation="28" flood-color="#2e2533" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1065" cy="32" r="220" fill="#7b6bc7" opacity=".08"/><circle cx="1120" cy="610" r="290" fill="#c77b54" opacity=".08"/>
  <text x="570" y="116" fill="#7d6c62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="750" letter-spacing="3">AI DESIGN LAB</text>
  <g filter="url(#shadow)"><rect x="94" y="147" width="330" height="330" rx="82" fill="url(#app)"/></g>
  <circle cx="194" cy="295" r="72" fill="url(#mia)" stroke="#f0b04f" stroke-width="5"/><text x="194" y="316" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="45" font-weight="850">MT</text>
  <circle cx="286" cy="295" r="72" fill="url(#priya)" stroke="#171720" stroke-width="10"/><text x="286" y="316" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="45" font-weight="850">PS</text>
  <circle cx="350" cy="365" r="52" fill="#5b9470" stroke="#171720" stroke-width="10"/><text x="350" y="380" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="36" font-weight="850">D</text>
  <rect x="137" y="411" width="244" height="20" rx="10" fill="#fff" opacity=".12"/><rect x="137" y="411" width="154" height="20" rx="10" fill="#f0b04f" opacity=".9"/>
  <text x="570" y="221" fill="#261f2a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="65" font-weight="820">Contact</text>
  <text x="570" y="278" fill="#a75c3f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" font-weight="750">THE PROBLEM</text>
  <text x="570" y="346" fill="#51464f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="520">One relationship-centered layer that</text>
  <text x="570" y="388" fill="#51464f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="520">prioritizes people over platforms.</text>
  <text x="570" y="510" fill="#7d6c62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="650">vanshea.com/aidesign</text>
